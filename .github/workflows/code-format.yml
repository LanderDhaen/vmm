---
name: Code Formatting

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  format-check:
    name: Check Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        id: format
        run: dotnet format --verify-no-changes --verbosity normal --exclude-diagnostics IDE0055 --exclude src/Rise.Server/Program.cs
        continue-on-error: true

      - name: Comment on PR with format errors
        if: steps.format.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Code Formatting Check Failed\n\nYour code does not meet the formatting standards defined in \`.editorconfig\`.\n\n**To fix this:**\n\`\`\`bash\ndotnet format\n\`\`\`\n\nThen commit and push the changes.\n\n---\n\n*This PR cannot be merged until formatting is fixed.*`
            });

      - name: Fail if formatting issues found
        if: steps.format.outcome == 'failure'
        run: |
          echo "::error::Code formatting check failed. Run 'dotnet format' to fix."
          exit 1
