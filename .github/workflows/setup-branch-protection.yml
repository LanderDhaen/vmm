---
name: Setup Branch Protection

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to protect"
        required: true
        default: "main"
        type: string
      enable:
        description: "Enable or disable protection"
        required: true
        default: true
        type: boolean

jobs:
  setup-branch-protection:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write

    steps:
      - name: Setup Branch Protection
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ github.event.inputs.branch }}';
            const enable = ${{ github.event.inputs.enable }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (enable) {
              // Enable branch protection
              try {
                await github.rest.repos.updateBranchProtection({
                  owner: owner,
                  repo: repo,
                  branch: branch,
                  required_status_checks: {
                    strict: true,
                    contexts: ['test']
                  },
                  restrictions: null
                });

                console.log(`Branch protection enabled for ${branch}`);
              } catch (error) {
                console.log(`Branch protection may already exist or needs manual configuration: ${error.message}`);

                // Try to create a ruleset instead (newer API)
                try {
                  await github.rest.repos.createRepoRuleset({
                    owner: owner,
                    repo: repo,
                    name: `${branch}-protection`,
                    target: 'branch',
                    enforcement: 'active',
                    conditions: {
                      ref_name: {
                        include: [`refs/heads/${branch}`],
                        exclude: []
                      }
                    },
                    rules: [
                      {
                        type: 'required_status_checks',
                        parameters: {
                          strict_required_status_checks_policy: true,
                          required_status_checks: [
                            { context: 'test' }
                          ]
                        }
                      }
                    ]
                  });

                  console.log(`Ruleset created for ${branch}`);
                } catch (rulesetError) {
                  console.log(`Failed to create ruleset: ${rulesetError.message}`);
                  throw rulesetError;
                }
              }
            } else {
              // Disable branch protection
              try {
                await github.rest.repos.deleteBranchProtection({
                  owner: owner,
                  repo: repo,
                  branch: branch
                });

                console.log(`Branch protection disabled for ${branch}`);
              } catch (error) {
                console.log(`Could not disable branch protection: ${error.message}`);

                try {
                  const { data: rulesets } = await github.rest.repos.getRepoRulesets({
                    owner: owner,
                    repo: repo
                  });

                  const branchRuleset = rulesets.find(rs =>
                    rs.conditions?.ref_name?.include?.includes(`refs/heads/${branch}`)
                  );

                  if (branchRuleset) {
                    await github.rest.repos.deleteRepoRuleset({
                      owner: owner,
                      repo: repo,
                      ruleset_id: branchRuleset.id
                    });
                    console.log(`Ruleset deleted for ${branch}`);
                  } else {
                    console.log(`No ruleset found for ${branch}`);
                  }
                } catch (rulesetError) {
                  console.log(`Could not delete ruleset: ${rulesetError.message}`);
                }
              }
            }
