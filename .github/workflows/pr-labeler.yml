---
name: PR Labeling

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr:
    name: Label Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze PR and add labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;

            // Get PR files
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: pr_number,
            });

            // Calculate changes
            let additions = 0;
            let deletions = 0;
            const changedDirs = new Set();

            files.forEach(file => {
              additions += file.additions;
              deletions += file.deletions;
              
              // Track which parts of codebase changed
              if (file.filename.includes('Rise.Client')) changedDirs.add('client');
              if (file.filename.includes('Rise.Server')) changedDirs.add('server');
              if (file.filename.includes('Rise.Domain')) changedDirs.add('domain');
              if (file.filename.includes('Rise.Services')) changedDirs.add('services');
              if (file.filename.includes('Rise.Shared')) changedDirs.add('shared');
              if (file.filename.includes('Rise.Persistence')) changedDirs.add('persistence');
              if (file.filename.includes('.Tests')) changedDirs.add('tests');
              if (file.filename.includes('.github')) changedDirs.add('ci/cd');
            });

            const totalChanges = additions + deletions;
            const labels = [];

            // Size labels
            if (totalChanges < 50) labels.push('size/xs');
            else if (totalChanges < 200) labels.push('size/s');
            else if (totalChanges < 500) labels.push('size/m');
            else if (totalChanges < 1000) labels.push('size/l');
            else labels.push('size/xl');

            // Area labels
            changedDirs.forEach(dir => labels.push(`area/${dir}`));

            // Add labels to PR
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr_number,
                labels,
              });
            }

            // Comment on XL PRs
            if (totalChanges >= 1000) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr_number,
                body: `## ⚠️ Large Pull Request\n\nThis PR has **${totalChanges} lines changed**. Consider breaking it into smaller PRs for easier review.\n\n**Tip**: Smaller PRs (< 500 lines) are:\n- Easier to review\n- Faster to merge\n- Less likely to have bugs\n- Easier to revert if needed`
              });
            }
