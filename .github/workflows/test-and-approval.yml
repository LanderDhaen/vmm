---
name: Tests and Approval Required

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run tests with coverage
        run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Process coverage reports
        uses: danielpalme/ReportGenerator-GitHub-Action@v5.2.0
        if: always()
        with:
          reports: "**/TestResults/*/coverage.cobertura.xml"
          targetdir: "**/TestResults/CoverageReport"
          reporttypes: "HtmlInline_AzurePipelines;Cobertura"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: "**/TestResults/CoverageReport/"
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/"
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './TestResults/CoverageReport/Cobertura.xml';

            if (fs.existsSync(path)) {
              const content = fs.readFileSync(path, 'utf8');
              // Parse coverage from Cobertura XML (simplified)
              const lineRate = content.match(/line-rate="([^"]+)"/);
              const coverage = lineRate ? Math.round(parseFloat(lineRate[1]) * 100) : 0;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 📊 Test Coverage Report\n\n**Current Coverage: ${coverage}%**\n\n[View detailed coverage report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n---\n\n*This comment was automatically generated by GitHub Actions.*`
              });
            }

      - name: Comment on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get the workflow run URL
            const run_id = context.runId;
            const workflow_url = `https://github.com/${owner}/${repo}/actions/runs/${run_id}`;

            // Create a comment with failure details
            await github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: issue_number,
              body: `## ❌ Tests Failed\n\nThe automated tests have failed. Please check the [test results](${workflow_url}) and fix the issues before merging.\n\n**Next steps:**\n1. Review the test failures in the workflow run\n2. Fix the failing tests\n3. Push your changes to this branch\n4. The tests will automatically re-run\n\n---\n\n*This comment was automatically generated by GitHub Actions.*`
            });
