<!DOCTYPE html>
<html lang="nl">

<head>
	<meta charset="utf-8"/>
	<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
	<title>Blazor WASM Auth</title>
	<base href="/"/>
	<link href="css/app.css" rel="stylesheet"/>
	<link href="favicon.png" rel="icon" type="image/png"/>
	<link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet"/>

	<link href="https://unpkg.com/leaflet/dist/leaflet.css" rel="stylesheet"/>
	<link href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" rel="stylesheet"/>

	<!-- Important: Increment the version parameter whenever you update MudBlazor to prevent caching issues -->
	<link href="_content/MudBlazor/MudBlazor.min.css?v=1" rel="stylesheet"/>
</head>
<body>
<div id="app">
	<svg class="loading-progress">
		<circle cx="50%" cy="50%" r="40%"/>
		<circle cx="50%" cy="50%" r="40%"/>
	</svg>
	<div class="loading-progress-text"></div>
</div>

<div data-nosnippet id="blazor-error-ui">
	Er is iets foutgelopen.
	<a class="reload" href="">Opnieuw proberen</a>
	<a class="dismiss">🗙</a>
</div>

<!-- ensure helper is loaded before Blazor starts -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="/js/pickMap.js"></script>

<script src="_framework/blazor.webassembly.js"></script>

<!-- MudBlazor and other libs can follow -->
<script src="_content/MudBlazor/MudBlazor.min.js?v=1"></script>
</body>
</html>
